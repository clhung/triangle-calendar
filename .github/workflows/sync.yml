name: Sync Triangle Kids Events

on:
  schedule:
    # Runs daily at 06:00 UTC (02:00 AM EDT / 01:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: python3 sync_events.py kids_events.ics

      - name: Commit and Push Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kids_events.ics public/kids_events.ics 2>/dev/null || git add kids_events.ics
          if git diff --staged --quiet; then
            echo "No calendar changes detected."
          else
            git commit -m "chore(calendar): update kids_events.ics [skip ci]"
            git push
          fi
